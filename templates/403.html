{% extends "base.html" %}

{% block title %}TestBrain - 无权访问{% endblock %}

{% block content %}
<div class="permission-denied">
    <div class="permission-icon">
        <i class="fas fa-lock"></i>
    </div>
    <h3 class="permission-title">没有访问权限</h3>
    <p class="permission-desc">
        {{ reason|default:"当前账号的角色不足以访问该页面。" }}
    </p>
    <a href="/" class="btn btn-primary">返回首页</a>
</div>
{% endblock %}
